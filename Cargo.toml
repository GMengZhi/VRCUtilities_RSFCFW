[package]
name = "vrc-utilities"
version = "0.1.0"
edition = "2021"
authors = ["Semeng <meng2772887108@outlook.com>"]

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ["http", "d1"] }
worker-macros = { version = "0.8", features = ["http"] }
http = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[profile.release]
opt-level = "s"
lto = true
